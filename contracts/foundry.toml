# Same toolchain as the Ronke casino contracts already live on Ronin:
# solc 0.8.28, EVM "paris" (Ronin has no PUSH0), OpenZeppelin 5.1.0.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 2000

[rpc_endpoints]
ronin = "https://api.roninchain.com/rpc"
saigon = "https://saigon-testnet.roninchain.com/rpc"
