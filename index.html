<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1f38" />
  <title>Ronke Rice Rush</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍙</text></svg>" />
  <link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <div id="app">
    <!-- Camera feed — fills viewport in AR mode, selfie-mirrored via CSS -->
    <video id="video" class="hidden" autoplay playsinline muted></video>

    <!-- Ronke face overlay / title ambience canvas — behind the game canvas -->
    <canvas id="ronke-canvas"></canvas>

    <!-- Game canvas — riceballs, catch zone, particles -->
    <canvas id="game-canvas"></canvas>

    <!-- ── Title screen ── -->
    <div class="screen" id="title-screen">
      <div class="menu-card">
        <img class="title-badge" src="/ronke/ronke-badge.png" alt="Ronke the Monke licking a riceball" />
        <h1 class="title-logo"><span class="logo-ronke">RONKE</span><span class="logo-rice">RICE RUSH</span></h1>
        <p class="title-tag">open wide. eat the rice.<br />dodge the rugs. ronke provides.</p>
        <button id="play-btn" class="big-btn">PLAY</button>
        <button id="touch-btn" class="text-btn">no camera? play with touch</button>
        <button id="how-btn" class="text-btn">how to play</button>
        <button id="sens-btn" class="text-btn sens-btn">detection: normal</button>
        <div class="best-chip" id="title-best"></div>
        <div class="lb hidden" id="lb-title">
          <div class="lb-heading">🏆 TOP MONKES</div>
          <ol class="lb-list" id="lb-title-list"></ol>
        </div>
        <div class="title-status" id="title-status"></div>
      </div>
    </div>

    <!-- ── Game HUD ── -->
    <div class="screen hidden" id="game-screen">
      <div class="hud">
        <div class="hud-pill hud-score-pill"><span class="hud-ico">🍙</span><span id="hud-score">0</span></div>
        <div class="hud-right">
          <div class="hud-hat hidden" id="hud-hat" title="Kasa — saves one miss">👒</div>
          <div class="hud-lives" id="hud-lives"></div>
        </div>
      </div>
      <div class="hud-combo hidden" id="hud-combo"></div>
      <div class="fever-banner hidden" id="fever-banner">
        <div class="fever-text">🔥 RONKE ARC 🔥</div>
        <div class="fever-bar"><div class="fever-bar-fill" id="fever-bar-fill"></div></div>
      </div>
      <div class="feedback hidden" id="feedback"></div>
    </div>

    <!-- ── Game over screen ── -->
    <div class="screen hidden" id="over-screen">
      <div class="menu-card">
        <img class="over-badge" src="/ronke/ronke-badge-idle.png" alt="Ronke the Monke, full and sleepy" />
        <h2 class="over-title">RONKE IS FULL</h2>
        <div class="over-score"><span id="over-score">0</span> <span class="over-score-ico">🍙</span></div>
        <div class="rank-chip" id="rank-chip"></div>
        <div class="best-chip" id="over-best"></div>
        <div class="stats-row" id="stats-row"></div>
        <div class="lb-submit" id="lb-submit">
          <input id="name-input" class="name-input" maxlength="14" placeholder="YOUR NAME" autocomplete="off" spellcheck="false" />
          <button id="submit-btn" class="submit-btn">SUBMIT</button>
        </div>
        <div class="lb-status" id="lb-status"></div>
        <button id="again-btn" class="big-btn">PLAY AGAIN</button>
        <button id="share-btn" class="share-btn">share your rank on 𝕏</button>
        <button id="home-btn" class="text-btn">back to title</button>
      </div>
    </div>

    <!-- Tutorial overlay — first run + "how to play" -->
    <div class="tutorial hidden" id="tutorial">
      <div class="tut-card">
        <div class="tut-sprites" id="tut-sprites"></div>
        <div class="tut-title" id="tut-title"></div>
        <div class="tut-text" id="tut-text"></div>
        <div class="tut-hint" id="tut-hint"></div>
        <div class="tut-dots" id="tut-dots"></div>
        <button class="text-btn" id="tut-skip">skip tutorial</button>
      </div>
    </div>

    <!-- Fever edge glow -->
    <div class="fever-glow" id="fever-glow" aria-hidden="true"></div>

    <!-- Mute toggle — always available -->
    <button id="mute-btn" class="mute-btn" aria-label="Toggle sound">🔊</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
