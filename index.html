<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1f38" />
  <title>Ronke Rice Rush</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐒</text></svg>" />
</head>
<body>
  <div id="app">
    <!-- Camera feed — fills viewport in AR mode, selfie-mirrored via CSS -->
    <video id="video" class="hidden" autoplay playsinline muted></video>

    <!-- Ronke face overlay canvas — behind the game canvas -->
    <canvas id="ronke-canvas"></canvas>

    <!-- Game canvas — riceballs, catch zone, particles -->
    <canvas id="game-canvas"></canvas>

    <!-- ── Title screen ── -->
    <div class="screen" id="title-screen">
      <div class="title-card">
        <img class="title-badge" src="/ronke/ronke-lick.gif" alt="Ronke the Monke licking" />
        <h1 class="title-logo">RONKE<br/>RICE RUSH</h1>
        <p class="title-tag">stick your tongue out. catch the riceballs.<br/>ronke provides. 🍙</p>
        <button id="play-btn" class="big-btn">PLAY</button>
        <button id="touch-btn" class="text-btn">no camera? play with touch</button>
        <div class="title-best" id="title-best"></div>
        <div class="title-status" id="title-status"></div>
      </div>
    </div>

    <!-- ── Calibration screen ── -->
    <div class="screen hidden" id="calibrate-screen">
      <div class="calibrate-card">
        <div class="calibrate-phase" id="calibrate-phase">1 / 2</div>
        <div class="calibrate-title" id="calibrate-title"></div>
        <div class="calibrate-sub" id="calibrate-sub"></div>
        <div class="calibrate-timer" id="calibrate-timer"></div>
        <div class="calibrate-meter"><div class="calibrate-meter-fill" id="calibrate-meter-fill"></div></div>
      </div>
    </div>

    <!-- ── Game HUD ── -->
    <div class="screen hidden" id="game-screen">
      <div class="hud">
        <div class="hud-score" id="hud-score">0</div>
        <div class="hud-lives" id="hud-lives"></div>
        <div class="hud-combo hidden" id="hud-combo"></div>
      </div>
      <div class="feedback hidden" id="feedback"></div>
    </div>

    <!-- ── Game over screen ── -->
    <div class="screen hidden" id="over-screen">
      <div class="title-card">
        <img class="over-badge" src="/ronke/ronke-badge.png" alt="Ronke the Monke" />
        <h2 class="over-title">RONKE IS FULL</h2>
        <div class="over-score"><span id="over-score">0</span> 🍙</div>
        <div class="over-best" id="over-best"></div>
        <button id="again-btn" class="big-btn">PLAY AGAIN</button>
        <button id="home-btn" class="text-btn">back to title</button>
      </div>
    </div>
    <!-- Mute toggle — always available -->
    <button id="mute-btn" class="mute-btn" aria-label="Toggle sound">🔊</button>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
